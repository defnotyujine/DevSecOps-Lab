repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false

      - id: gofmt
        name: gofmt
        entry: gofmt -l
        language: system
        files: \.go$

      - id: conftest-containerfile
        name: conftest (Containerfile policy)
        entry: conftest test --policy policy/ --parser dockerfile
        language: system
        files: ^app/Containerfile$
