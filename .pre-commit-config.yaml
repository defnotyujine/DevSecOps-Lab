repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false

      - id: gofmt
        name: gofmt
        entry: gofmt -l
        language: system
        files: \.go$

      - id: conftest-containerfile
        name: conftest (Containerfile policy)
        entry: conftest test --policy policy/ --parser dockerfile
        language: system
        files: ^app/Containerfile$
