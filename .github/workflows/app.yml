name: app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

      - name: CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: codeql

      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: app/go.mod
          work-dir: app
          repo-checkout: false

      - name: Checkov
        run: |
          docker run --rm -v "${{ github.workspace }}:/tf" \
            bridgecrew/checkov@sha256:7407699a91a556849ae66e05c3753f58cf0ce922aa6ddfac7839aad4f390c016 \
            -d /tf -o sarif --output-file-path /tf --compact \
            --skip-check CKV_GIT_1,CKV2_GIT_1
          # CKV_GIT_1 (repo must be private): repo is deliberately public for
          # free CodeQL/Actions minutes.
          # CKV2_GIT_1 (branch protection): enforced via
          # github_repository_ruleset.main (infra/github/ruleset.tf).

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: results_sarif.sarif
          category: checkov

  build-image:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install conftest
        run: |
          curl -sLO https://github.com/open-policy-agent/conftest/releases/download/v0.70.0/conftest_0.70.0_Linux_x86_64.tar.gz
          echo "e738506fd808f7dc9794ce8e325f89b14932891a4841fe45f1f24c4a9bb3ed96  conftest_0.70.0_Linux_x86_64.tar.gz" | sha256sum -c -
          tar xzf conftest_0.70.0_Linux_x86_64.tar.gz conftest
          sudo mv conftest /usr/local/bin/

      - name: Conftest (Containerfile policy)
        run: conftest test --policy policy/ --parser dockerfile app/Containerfile

      - name: Build image
        run: podman build -t app:${{ github.sha }} -f app/Containerfile app/

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push by digest
        id: push
        run: |
          podman push --digestfile=/tmp/digest \
            app:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/devsecops-lab/app:${{ github.sha }}
          echo "digest=$(cat /tmp/digest)" >> "$GITHUB_OUTPUT"

  attest:
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/devsecops-lab/app
      DIGEST: ${{ needs.build-image.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install syft
        run: |
          curl -sLO https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz
          echo "8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3  syft_1.51.1_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf syft_1.51.1_linux_amd64.tar.gz syft
          sudo mv syft /usr/local/bin/

      - name: Install grype
        run: |
          curl -sLO https://github.com/anchore/grype/releases/download/v0.118.0/grype_0.118.0_linux_amd64.tar.gz
          echo "1d444c5e7360471815f7158f71935fcecc68a3c417d85c7344f770854300bba2  grype_0.118.0_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf grype_0.118.0_linux_amd64.tar.gz grype
          sudo mv grype /usr/local/bin/

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: SBOM (Syft)
        run: syft "${IMAGE}@${DIGEST}" -o cyclonedx-json=sbom.cdx.json

      - name: Vulnerability scan (Grype)
        run: grype sbom:sbom.cdx.json -o json > grype.json

      - name: Install conftest
        run: |
          curl -sLO https://github.com/open-policy-agent/conftest/releases/download/v0.70.0/conftest_0.70.0_Linux_x86_64.tar.gz
          echo "e738506fd808f7dc9794ce8e325f89b14932891a4841fe45f1f24c4a9bb3ed96  conftest_0.70.0_Linux_x86_64.tar.gz" | sha256sum -c -
          tar xzf conftest_0.70.0_Linux_x86_64.tar.gz conftest
          sudo mv conftest /usr/local/bin/

      - name: Conftest (vuln policy)
        run: conftest test grype.json --policy policy/

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Sign image (keyless)
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest SBOM
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
